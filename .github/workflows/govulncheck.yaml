name: CI vulnerability detection with govulncheck

on:
  pull_request:
    branches:
      - main
      - release-4.22_clone
      - "release-4.22"
      - "release-4.21"
      - "release-4.20"
      - "release-4.19"
      - "release-4.18"
  push:
    branches:
      - main

env:
  GOLANG_VERSION: 1.25.12
  MODEL: google/gemini-3.6-flash

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Show current working directory
        run: pwd

      # Use manual govulncheck install instead of golang/govulncheck-action
      # because the action always pulls govulncheck@latest which can break
      # with newer Go versions. See https://github.com/golang/go/issues/80059
      - name: Run govulncheck
        id: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3
          govulncheck ./... 2>&1 | tee govulncheck-output.txt
        continue-on-error: true

      - name: Run OpenCode to fix vulnerabilities
        if: steps.govulncheck.outcome == 'failure' && github.event_name == 'pull_request'
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.NROP_ASSISTANT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ env.MODEL }}
          use_github_token: true
          prompt: |
            The file `govulncheck-output.txt` contains a vulnerability report.

            Fix the vulnerabilities:
            1. Run `git fetch origin ${{ github.base_ref }}`.
            2. Check if a branch `fix/govulncheck-<short-vuln-id>` already exists remotely with `git ls-remote --heads origin fix/govulncheck-<short-vuln-id>`. If it does, a fix is already in progress — stop and do nothing.
            3. Create a new branch from the base: `git checkout -b fix/govulncheck-<short-vuln-id> origin/${{ github.base_ref }}`.
            4. Bump the affected packages in go.mod to versions that resolve them.
            5. Run `go mod tidy` and `go mod vendor`.
            6. Verify with `go build ./...`.
            7. Commit with message "deps: bump <pkg> to <version> to fix <vuln-id>" and include a `Signed-off-by: ${{ env.MODEL }}` trailer.
            8. Run `git push origin HEAD`.
            9. Run `gh pr create --base ${{ github.base_ref }} --head $(git branch --show-current) --title "[ai-bot] deps: fix <vuln-id>" --body "Automated fix generated by ${{ env.MODEL }} via OpenCode.

            Bumped the following packages to resolve vulnerabilities detected by govulncheck:
            - <list each bumped package and its new version>

            Vulnerability IDs: <list vuln IDs>"`.
